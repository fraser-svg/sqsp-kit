<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sqsp-kit harness — data-config fetch path</title>
<link rel="stylesheet" href="../dist/kit.min.css">
<style>
  /* Approximation of the Squarespace 7.1 page shell: a header with .header-nav-item
     links, and sections carrying data-section-id. Deliberately plain — the point is
     to prove our CSS does not leak, not to clone their design. */
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:#111; }
  .header { position:sticky; top:0; background:#fff; border-bottom:1px solid #e6e6e6; z-index:100; }
  .header-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:18px 32px; }
  .header-title { font-weight:600; letter-spacing:-.01em; }
  .header-nav { display:flex; gap:28px; }
  .header-nav-item a { color:#111; text-decoration:none; font-size:15px; padding:8px 0; display:inline-block; }
  .page-section { max-width:1200px; margin:0 auto; padding:0 32px; }
  .page-section + .page-section { border-top:1px solid #f0f0f0; }
  .harness-bar { position:fixed; bottom:12px; left:12px; z-index:99999; font:12px/1.4 ui-monospace,monospace; color:#666; background:#fff; border:1px solid #ddd; padding:8px 10px; border-radius:6px; }
  .native { font-size:15px; line-height:1.6; color:#444; max-width:60ch; }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-title">Harness Co.</div>
    <nav class="header-nav">
      <div class="header-nav-item"><a href="/">Home</a></div>
      <div class="header-nav-item"><a href="/services">Services</a></div>
      <div class="header-nav-item"><a href="/about">About</a></div>
      <div class="header-nav-item"><a href="/contact">Contact</a></div>
    </nav>
  </div>
</header>

<!-- native Squarespace-ish content: proves the kit's CSS does not touch it -->
<section class="page-section" data-section-id="native-copy">
  <div style="padding:48px 0">
    <h1 style="font-size:34px;margin:0 0 12px">Native section (not ours) — config fetched over HTTP</h1>
    <p class="native">This block is styled by the host page only. If the kit's stylesheet leaks, this text changes. It should not.</p>
  </div>
</section>

<section class="page-section" data-section-id="hero"></section>
<section class="page-section" data-section-id="logos"></section>

<!-- Breakpoints must be tested with a real viewport, not a CSS max-width:
     matchMedia reports the window, so a narrowed container keeps every md:
     utility active and hides exactly the bugs you are looking for.
     Resize the window, or: chrome --headless --window-size=390,900 -->
<div class="harness-bar">resize the window — md: breakpoints follow the viewport, not this box</div>

<script>
  window.__SK_DEBUG__ = true   // warn() is silent otherwise; mount failures would be invisible
  // config deliberately absent: this page proves the data-config fetch path
</script>
<script src="../dist/kit.min.js" data-config="../clients/harness.json"></script>
</body>
</html>
