<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sqsp-kit harness</title>
<link rel="stylesheet" href="../dist/kit.min.css">
<style>
  /* Approximation of the Squarespace 7.1 page shell: a header with .header-nav-item
     links, and sections carrying data-section-id. Deliberately plain — the point is
     to prove our CSS does not leak, not to clone their design. */
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:#111; }
  .header { position:sticky; top:0; background:#fff; border-bottom:1px solid #e6e6e6; z-index:100; }
  .header-inner { max-width:1200px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:18px 32px; }
  .header-title { font-weight:600; letter-spacing:-.01em; }
  .header-nav { display:flex; gap:28px; }
  .header-nav-item a { color:#111; text-decoration:none; font-size:15px; padding:8px 0; display:inline-block; }
  .page-section { max-width:1200px; margin:0 auto; padding:0 32px; }
  .page-section + .page-section { border-top:1px solid #f0f0f0; }
  .harness-bar { position:fixed; bottom:12px; left:12px; z-index:99999; display:flex; gap:6px; font:12px/1 ui-monospace,monospace; }
  .harness-bar button { border:1px solid #ccc; background:#fff; padding:6px 10px; border-radius:6px; cursor:pointer; }
  .native { font-size:15px; line-height:1.6; color:#444; max-width:60ch; }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-title">Harness Co.</div>
    <nav class="header-nav">
      <div class="header-nav-item"><a href="/">Home</a></div>
      <div class="header-nav-item"><a href="/services">Services</a></div>
      <div class="header-nav-item"><a href="/about">About</a></div>
      <div class="header-nav-item"><a href="/contact">Contact</a></div>
    </nav>
  </div>
</header>

<!-- native Squarespace-ish content: proves the kit's CSS does not touch it -->
<section class="page-section" data-section-id="native-copy">
  <div style="padding:48px 0">
    <h1 style="font-size:34px;margin:0 0 12px">Native section (not ours)</h1>
    <p class="native">This block is styled by the host page only. If the kit's stylesheet leaks, this text changes. It should not.</p>
  </div>
</section>

<section class="page-section" data-section-id="hero"></section>
<section class="page-section" data-section-id="logos"></section>

<div class="harness-bar">
  <button data-w="390">390</button><button data-w="768">768</button><button data-w="1440">1440</button><button data-w="">reset</button>
</div>

<script>
  window.SQSPKIT = {
    theme: { primary: "24 94% 50%", radius: "14px" },
    components: [
      { id: "hero-split", target: "hero", options: {
          eyebrow: "Independent studio",
          heading: "Design systems, delivered onto Squarespace.",
          body: "Components sourced from anywhere, converted once, and mounted on any client site from a single hosted bundle.",
          ctaLabel: "Start a project", ctaHref: "/contact",
          secondaryLabel: "See work", secondaryHref: "/work",
          image: "https://images.unsplash.com/photo-1497366216548-37526070297c?w=1200&q=70"
      }},
      { id: "logo-marquee", target: "logos", options: {
          speed: 26,
          logos: [
            { src: "https://cdn.simpleicons.org/squarespace/111111", alt: "Squarespace" },
            { src: "https://cdn.simpleicons.org/tailwindcss/111111", alt: "Tailwind" },
            { src: "https://cdn.simpleicons.org/figma/111111", alt: "Figma" },
            { src: "https://cdn.simpleicons.org/react/111111", alt: "React" },
            { src: "https://cdn.simpleicons.org/stripe/111111", alt: "Stripe" },
            { src: "https://cdn.simpleicons.org/webflow/111111", alt: "Webflow" }
          ]
      }},
      { id: "mega-menu", mode: "augment", target: "body", options: {
          menus: [{ match: "Services", columns: [
            { title: "Build", links: [
              { label: "Website design", href: "/services/design", description: "Strategy through launch" },
              { label: "Squarespace builds", href: "/services/squarespace", description: "7.1, custom coded" }]},
            { title: "Grow", links: [
              { label: "SEO", href: "/services/seo", description: "Local and technical" },
              { label: "Content", href: "/services/content", description: "Written to convert" }]},
            { title: "Care", links: [
              { label: "Maintenance", href: "/services/care" },
              { label: "Hosting", href: "/services/hosting" }]},
            { title: "Company", links: [
              { label: "About", href: "/about" },
              { label: "Contact", href: "/contact" }]}
          ]}]
      }}
    ]
  }
  document.querySelector('.harness-bar').addEventListener('click', (e) => {
    const w = e.target.dataset.w
    if (w === undefined) return
    document.documentElement.style.maxWidth = w ? w + 'px' : ''
    document.documentElement.style.margin = w ? '0 auto' : ''
    document.documentElement.style.boxShadow = w ? '0 0 0 1px #ddd' : ''
  })
</script>
<script src="../dist/kit.min.js"></script>
</body>
</html>
